name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The published entry point must actually run on a clean install.
      - run: node dist/cli.js --version
      - run: node dist/cli.js --help

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and inspect
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const { readFileSync } = require('node:fs');
            const [pkg] = JSON.parse(readFileSync('pack.json', 'utf8'));
            const files = pkg.files.map((f) => f.path);
            const stray = files.filter((f) => !/^(dist\/|README\.md$|SKILL\.md$|LICENSE$|package\.json$)/.test(f));
            if (stray.length) {
              console.error('unexpected files in the tarball:', stray);
              process.exit(1);
            }
            if (!files.includes('dist/cli.js')) {
              console.error('dist/cli.js missing from the tarball');
              process.exit(1);
            }
            console.log(files.length + ' files, ' + pkg.size + ' bytes');
          "
      - name: Fail if a runtime dependency appeared
        run: |
          node -e "
            const pkg = require('./package.json');
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length) {
              console.error('this package ships with zero runtime dependencies; found:', deps);
              console.error('see CLAUDE.md — adding one needs an issue and a maintainer decision');
              process.exit(1);
            }
          "

  install:
    name: install from tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the packed tarball globally and run it
        run: |
          TARBALL=$(npm pack --silent)
          npm i -g "./$TARBALL"
          x402 --version
          x402 probe --help >/dev/null 2>&1 || true
          test "$(x402 --version)" = "$(node -p 'require("./package.json").version')"
