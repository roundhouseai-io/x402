version: 2
updates:
  # Dev dependencies only — the package has no runtime dependencies, and that is
  # a property worth keeping visible in these PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ['type: chore', 'release: skip']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-tooling:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['type: chore', 'release: skip']
    commit-message:
      prefix: 'chore(actions)'
